name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the privacy scan reads every commit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:browser
      - run: npm run build
      - run: npm run check:pack
      - run: npm run check:dts49
      - name: Privacy scan
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: node scripts/privacy-scan.mjs --tree --history --pack

  compat:
    # Consumer builds (Create React App 5, TypeScript 4.9, Vite + React 19) on the Node versions apps still use.
    # Only on main and manual runs, to keep CI minutes low.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/compat.mjs
