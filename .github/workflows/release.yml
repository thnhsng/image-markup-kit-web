name: Release

# Publishes a version to npm when its tag (v0.1.1, …) is pushed: the checks run again, a maintainer approves the
# `npm` environment, then npm publishes with provenance through trusted publishing (no token is stored here).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the privacy scan reads every commit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:browser
      - run: npm run build
      - run: npm run check:pack
      - run: npm run check:dts49
      - name: Privacy scan
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: node scripts/privacy-scan.mjs --tree --history --pack --require-terms

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public --ignore-scripts
      - name: Privacy scan of the published version
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: node scripts/privacy-scan.mjs --registry "${GITHUB_REF_NAME#v}" --require-terms
      - name: GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
